<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>旅のしおり APIテスト画面</title>
    <style>
        body { font-family: sans-serif; margin: 30px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #trip-list { list-style: none; padding: 0; }
        .trip-item { background: #fff; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>🌸 旅のしおり APIテスト</h1>

    <div class="card">
        <h3>1. 新しい旅行を追加する</h3>
        <input type="text" id="title" placeholder="旅行のタイトル">
        <input type="text" id="destination" placeholder="行き先">
        <button onclick="createTrip()">保存する</button>
    </div>

    <div class="card">
        <h3>2. 保存された旅行一覧</h3>
        <button onclick="fetchTrips()" style="background: #28a745;">一覧を更新</button>
        <ul id="trip-list"></ul>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/trips/";

        // 旅行を保存する関数
        async function createTrip() {
            const title = document.getElementById('title').value;
            const destination = document.getElementById('destination').value;

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: title, destination: destination })
            });

            if (response.ok) {
                alert("保存成功！");
                fetchTrips(); // 一覧を更新
            } else {
                alert("エラーが発生しました");
            }
        }

        // 旅行一覧を取得して表示する関数
        async function fetchTrips() {
            const response = await fetch(API_URL);
            const trips = await response.json();
            const listElement = document.getElementById('trip-list');
            listElement.innerHTML = "";

            trips.forEach(trip => {
                const li = document.createElement('li');
                li.className = "trip-item";
                li.textContent = `✈️ ${trip.title} （行き先: ${trip.destination}）`;
                listElement.appendChild(li);
            });
        }
    </script>
</body>
</html>
